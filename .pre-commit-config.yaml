# Pre-commit hooks — native Rust + Qt
#
# To activate for your local working tree:
#     pre-commit install
#
# The hooks run on `git commit`. To run them manually:
#     pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'  # trailing whitespace can be significant in markdown (line breaks)
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: bash -c 'cargo fmt --check'
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cargo clippy --locked -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
      - id: clang-format
        name: clang-format --dry-run
        entry: bash -c 'clang-format --dry-run --Werror $(git diff --cached --name-only --diff-filter=ACM | grep -E "\.(cpp|h|hpp)$" || true)'
        language: system
        pass_filenames: false

  # Local hook: reject anything that mentions the maintainer's home path.
  # Prevents accidental leaks of personal paths into the public tree.
  - repo: local
    hooks:
      - id: no-home-lexaloud
        name: no /home/lexaloud paths
        entry: sh -c 'if grep -rE "^[^#]*/home/[^/]+/" --include="*.rs" --include="*.cpp" --include="*.h" --include="*.sh" --include="*.md" --include="*.toml" --include="*.yaml" src/ ui/ scripts/ docs/ .github/ CMakeLists.txt CMakePresets.json README.md 2>/dev/null | grep -v "plans/"; then echo "hook found absolute home path references"; exit 1; fi'
        language: system
        pass_filenames: false
