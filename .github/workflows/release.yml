name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and gate (native CPU AppImage)
    runs-on: ubuntu-24.04
    # Use pinned Ubuntu 24.04 container digest for reproducibility
    # Update digest in packaging/Containerfile.builder when base changes
    # container: ubuntu:24.04@sha256:...
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned 1.85)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install system deps (Qt6, CMake, audio, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-tools-dev libqt6svg6-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            clang clang-format patchelf curl ca-certificates file binutils \
            wl-clipboard xclip libnotify-bin libportaudio2 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libx11-6 libxext6 libxrender1 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxkbcommon0 libgl1 libegl1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      # --- Complete gate from clean checkout (Phase 10 gate) ---
      - name: Rust quality gate
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --all-targets --all-features

      - name: Qt format + build + tests
        run: |
          find ui -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
          env -u LD_LIBRARY_PATH cmake --preset release
          env -u LD_LIBRARY_PATH cmake --build --preset release --parallel
          QT_QPA_PLATFORM=offscreen env -u LD_LIBRARY_PATH ctest --preset release --output-on-failure

      - name: Build native stage
        run: ./scripts/build-native.sh --release --stage "$PWD/build/stage"

      - name: Build CPU AppImage
        run: ./scripts/build-appimage.sh

      - name: Smoke AppImage
        run: ./scripts/smoke-appimage.sh build/appimage/Lexaloud-*.AppImage

      # --- Artifacts for release ---
      - name: Generate SHA256 checksums
        run: |
          cd build/appimage
          sha256sum Lexaloud-*.AppImage > SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS || true
          # Also for staged manifest
          cd "$GITHUB_WORKSPACE"
          find build/stage -type f | sort > build/staged-files.txt
          find build/appdir -type f | sort > build/appdir-files.txt 2>/dev/null || true
          sha256sum build/appimage/Lexaloud-*.AppImage | tee build/appimage/SHA256SUMS
          cat build/staged-files.txt | head -20

      - name: Generate SBOM / staged manifest
        run: |
          echo "# Lexaloud release manifest" > build/MANIFEST.txt
          echo "version: ${GITHUB_REF_NAME}" >> build/MANIFEST.txt
          echo "commit: ${GITHUB_SHA}" >> build/MANIFEST.txt
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build/MANIFEST.txt
          echo >> build/MANIFEST.txt
          echo "## Staged files (build/stage)" >> build/MANIFEST.txt
          cat build/staged-files.txt >> build/MANIFEST.txt
          echo >> build/MANIFEST.txt
          echo "## AppDir files" >> build/MANIFEST.txt
          cat build/appdir-files.txt 2>/dev/null >> build/MANIFEST.txt || true
          echo >> build/MANIFEST.txt
          echo "## ldd lexaloud" >> build/MANIFEST.txt
          env -u LD_LIBRARY_PATH ldd build/stage/bin/lexaloud >> build/MANIFEST.txt 2>&1 || true
          echo >> build/MANIFEST.txt
          echo "## ldd lexaloud-ui" >> build/MANIFEST.txt
          env -u LD_LIBRARY_PATH ldd build/stage/bin/lexaloud-ui >> build/MANIFEST.txt 2>&1 || true
          echo >> build/MANIFEST.txt
          echo "## Cargo lock" >> build/MANIFEST.txt
          echo "Cargo.lock sha256: $(sha256sum Cargo.lock | cut -d' ' -f1)" >> build/MANIFEST.txt
          cat build/MANIFEST.txt

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lexaloud-appimage-release
          path: |
            build/appimage/Lexaloud-*.AppImage
            build/appimage/SHA256SUMS
            build/MANIFEST.txt
            build/staged-files.txt
            build/appdir-files.txt
          if-no-files-found: error

      - name: Upload ldd reports
        uses: actions/upload-artifact@v7
        with:
          name: lexaloud-ldd-release
          path: |
            build/appimage/ldd-*.txt
            build/MANIFEST.txt
          if-no-files-found: warn

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: lexaloud-appimage-release
          path: dist/

      - name: List dist
        run: ls -lh dist/ && cat dist/SHA256SUMS 2>/dev/null || true; cat dist/MANIFEST.txt 2>/dev/null | head -100 || true

      - name: Extract CHANGELOG excerpt
        id: changelog
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION — using default notes" > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            cat dist/MANIFEST.txt 2>/dev/null | head -50 >> /tmp/release-notes.md || true
          fi
          cat /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: |
            dist/Lexaloud-*.AppImage
            dist/SHA256SUMS
            dist/MANIFEST.txt
          fail_on_unmatched_files: false
          generate_release_notes: false
