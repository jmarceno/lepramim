[package]
name = "lepramim"
version = "0.2.0"
edition = "2024"
description = "Lepramim - local private Linux text-to-speech"
authors = ["Lepramim"]
license = "MIT"
rust-version = "1.85"

[lib]
name = "lepramim"
path = "src/lib.rs"

[[bin]]
name = "lepramim"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.43.0", features = ["full"] }
iced = { version = "=0.13.1", default-features = false, features = ["tiny-skia", "tokio", "advanced", "svg"] }
ksni = { version = "=0.2.2" }
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts"] }
usvg = { version = "=0.48.1" }
crossbeam-channel = { version = "=0.5.15" }
axum = { version = "=0.7.9" }
hyper = { version = "=1.6.0" }
hyper-util = { version = "=0.1.12", features = ["client", "http1", "tokio"] }
tower = { version = "=0.5.2" }
tower-http = { version = "=0.6.6" }
bytes = { version = "=1.8.0" }
http-body-util = { version = "=0.1.3" }
clap = { version = "=4.5.20", features = ["derive"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = { version = "=1.0.133" }
toml = { version = "=0.8.23" }
tracing = { version = "=0.1.41" }
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
thiserror = { version = "=2.0.20" }
directories = { version = "=5.0.1" }
regex = { version = "=1.11.1" }
pulldown-cmark = { version = "=0.13.0" }
sha2 = { version = "=0.10.8" }
hex = { version = "=0.4.3" }
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
cpal = { version = "=0.15.3" }
ureq = { version = "=2.12.1" }
zbus = { version = "=4.4.0", default-features = false, features = ["tokio", "blocking"] }
ashpd = { version = "=0.8.1", default-features = false, features = ["async-std"] }

[features]
default = []
cuda = ["ort/cuda"]

[dev-dependencies]
tempfile = { version = "=3.15.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
panic = "abort"
