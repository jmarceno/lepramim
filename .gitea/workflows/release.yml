name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libssl-dev libasound2-dev espeak-ng \
            pkg-config patchelf curl ca-certificates file binutils \
            wl-clipboard xclip libnotify-bin libportaudio2 \
            libfontconfig1 libfreetype6 libdbus-1-3 libdbus-1-dev libglib2.0-0 \
            libx11-6 libxext6 libxrender1 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxkbcommon0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libgtk-3-0 libappindicator3-1 libxdo3 xvfb

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Rust quality gate
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Build native stage and AppImage
        run: |
          ./scripts/build-native.sh --release --stage "$PWD/build/stage"
          ./scripts/build-appimage.sh

      - name: Smoke AppImage
        run: ./scripts/smoke-appimage.sh build/appimage/Lepramim-*.AppImage

      - name: Generate SHA256 and manifests
        run: |
          set -e
          mkdir -p dist
          cp build/appimage/Lepramim-*.AppImage dist/ 2>/dev/null || true
          cd dist && sha256sum Lepramim-*.AppImage > SHA256SUMS 2>/dev/null || true
          cd "$GITHUB_WORKSPACE" || cd "$PWD"
          find build/stage -type f | sort > dist/staged-files.txt 2>/dev/null || true
          find build/appdir -type f | sort > dist/appdir-files.txt 2>/dev/null || true
          {
            echo "# Lepramim release manifest"
            echo "version: ${GITEA_REF_NAME:-unknown}"
            echo
            echo "## ldd lepramim"
            env -u LD_LIBRARY_PATH ldd build/stage/bin/lepramim 2>&1 || true
          } > dist/MANIFEST.txt

      - name: Create Gitea release and upload assets
        if: startsWith(gitea.ref, 'refs/tags/v')
        env:
          GITEA_API_URL: ${{ gitea.server_url }}/api/v1
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_REF_NAME: ${{ gitea.ref_name }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITEA_REF_NAME#v}"
          notes_file="$(mktemp)"
          curl_config="$(mktemp)"
          trap 'rm -f "$notes_file" "$curl_config"' EXIT
          awk -v ver="$version" '$0 ~ "^## \\[" ver "\\]" { found=1; next } found && /^## \\[/ { exit } found { print }' CHANGELOG.md > "$notes_file"
          [[ -s "$notes_file" ]] || echo "Lepramim $version" > "$notes_file"
          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" > "$curl_config"
          chmod 0600 "$curl_config"
          payload="$(jq -n --arg tag "$GITEA_REF_NAME" --arg name "Lepramim $version" --rawfile body "$notes_file" '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')"
          release="$(curl --fail --silent --show-error --config "$curl_config" --request POST --header 'Content-Type: application/json' --data "$payload" "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases")"
          release_id="$(jq -er '.id' <<<"$release")"
          for asset in dist/*; do
            [[ -f "$asset" ]] || continue
            asset_name="$(basename "$asset")"
            encoded_name="$(jq -rn --arg name "$asset_name" '$name | @uri')"
            curl --fail --silent --show-error --config "$curl_config" --header 'Content-Type: application/octet-stream' --data-binary "@$asset" "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases/$release_id/assets?name=$encoded_name" >/dev/null
          done
