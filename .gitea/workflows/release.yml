name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned 1.85)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install system deps (Qt6, CMake, audio, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-tools-dev libqt6svg6-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            clang clang-format patchelf curl ca-certificates file binutils \
            wl-clipboard xclip libnotify-bin libportaudio2 \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libx11-6 libxext6 libxrender1 libxcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxkbcommon0 libgl1 libegl1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Rust quality gate
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --all-targets --all-features

      - name: Qt format + build + tests
        run: |
          find ui -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
          env -u LD_LIBRARY_PATH cmake --preset release
          env -u LD_LIBRARY_PATH cmake --build --preset release --parallel
          QT_QPA_PLATFORM=offscreen env -u LD_LIBRARY_PATH ctest --preset release --output-on-failure

      - name: Build native stage
        run: ./scripts/build-native.sh --release --stage "$PWD/build/stage"

      - name: Build CPU AppImage
        run: ./scripts/build-appimage.sh

      - name: Smoke AppImage
        run: ./scripts/smoke-appimage.sh build/appimage/Lexaloud-*.AppImage

      - name: Generate SHA256 and manifests
        run: |
          set -e
          mkdir -p dist
          cp build/appimage/Lexaloud-*.AppImage dist/ 2>/dev/null || true
          cp build/appimage/Lexaloud-*.AppImage.tar.gz dist/ 2>/dev/null || true
          cd dist && sha256sum Lexaloud-*.AppImage > SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS || true
          cd "$GITHUB_WORKSPACE" || cd "$PWD"
          find build/stage -type f | sort > dist/staged-files.txt 2>/dev/null || true
          find build/appdir -type f | sort > dist/appdir-files.txt 2>/dev/null || true
          {
            echo "# Lexaloud release manifest"
            echo "version: ${GITEA_REF_NAME:-unknown}"
            echo "commit: ${GITEA_SHA:-unknown}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Staged files"
            cat dist/staged-files.txt 2>/dev/null || true
            echo
            echo "## ldd lexaloud"
            env -u LD_LIBRARY_PATH ldd build/stage/bin/lexaloud 2>&1 || true
            echo
            echo "## ldd lexaloud-ui"
            env -u LD_LIBRARY_PATH ldd build/stage/bin/lexaloud-ui 2>&1 || true
          } > dist/MANIFEST.txt
          cat dist/MANIFEST.txt | head -100
          ls -lh dist/

      - name: Create Gitea release and upload assets
        if: startsWith(gitea.ref, 'refs/tags/v')
        env:
          GITEA_API_URL: ${{ gitea.server_url }}/api/v1
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_REF_NAME: ${{ gitea.ref_name }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail

          version="${GITEA_REF_NAME#v}"
          notes_file="$(mktemp)"
          curl_config="$(mktemp)"
          cleanup() {
            rm -f "$notes_file" "$curl_config"
          }
          trap cleanup EXIT

          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "No CHANGELOG section for $version" > "$notes_file"
            echo "" >> "$notes_file"
            cat dist/MANIFEST.txt 2>/dev/null | head -50 >> "$notes_file" || true
          fi

          printf 'header = "Authorization: token %s"\n' "$GITEA_TOKEN" > "$curl_config"
          chmod 0600 "$curl_config"

          payload="$(jq -n \
            --arg tag "$GITEA_REF_NAME" \
            --arg name "Lexaloud $version" \
            --rawfile body "$notes_file" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')"

          release="$(curl --fail --silent --show-error --config "$curl_config" \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases")"
          release_id="$(jq -er '.id' <<<"$release")"

          for asset in dist/*; do
            [[ -f "$asset" ]] || continue
            asset_name="$(basename "$asset")"
            encoded_name="$(jq -rn --arg name "$asset_name" '$name | @uri')"
            echo "Uploading $asset_name"
            curl --fail --silent --show-error --config "$curl_config" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$asset" \
              "$GITEA_API_URL/repos/$GITEA_REPOSITORY/releases/$release_id/assets?name=$encoded_name" \
              >/dev/null
          done

          echo "Release $GITEA_REF_NAME published with $(find dist -maxdepth 1 -type f | wc -l) assets."
